schema_version: "1.0"
name: grill-07-skip-questions-in-project
description: grill-02's "skip the questions" request, run inside a scaffolded Godot project so the SessionStart card is injected. Guards the card's rule on asking the developer against overriding an explicit off-ramp. Needs --scaffold; without it the workspace is empty and this is grill-02 again.
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Design a save system for my Godot 4 platformer. Skip the questions and just go — give me the design you'd build, no code yet. Make whatever calls you need.
