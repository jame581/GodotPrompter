name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; only the release and directory-bundle jobs get write access. Only
# directory-bundle pushes to this repo with git, so only its checkout keeps the token.
permissions:
  contents: read

jobs:
  verify:
    name: Verify version consistency and validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          MARKET=$(node -p "const p=require('./.claude-plugin/marketplace.json').plugins.find(x=>x.name==='godot-prompter'); p ? p.version : ''")
          CURSOR=$(node -p "require('./.cursor-plugin/plugin.json').version")
          ANTIGRAVITY=$(node -p "require('./plugin.json').version")
          echo "tag=$TAG  package.json=$PKG  .claude-plugin/plugin.json=$PLUGIN  marketplace.json=$MARKET  .cursor-plugin/plugin.json=$CURSOR  plugin.json=$ANTIGRAVITY"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$PLUGIN" ] || [ "$TAG" != "$MARKET" ] || [ "$TAG" != "$CURSOR" ] || [ "$TAG" != "$ANTIGRAVITY" ]; then
            echo "::error::Version drift between tag and in-repo files"
            exit 1
          fi

      - name: Run skill validator
        run: node scripts/validate-skills.mjs

      # v1.13.0 ships executable code (hooks/) for the first time. Manual smoke-testing on one
      # machine is not a gate — these cover platform output shapes, project detection,
      # config/features parsing, and that the scripts carry no CR bytes.
      - name: Run hook tests
        run: npm run test:hooks

      # Two content rules record ERRORs: a parity-exemption marker with no reason, and a GDScript
      # example using a known-nonexistent API. The validator exits non-zero on any error, so either
      # fails the release tag itself. Gate their tests.
      - name: Run validator tests
        run: npm run test:validator

      - name: Run metadata checks
        run: npm run test:metadata

      # Self-test: the fixtures under scripts/fixtures/ are deliberately broken (over budget,
      # bad frontmatter, broken cross-ref). If the validator ever stops catching them, its rules
      # have been silently disabled — fail loudly rather than pass a release that isn't checked.
      - name: Validator self-test (fixtures must fail)
        run: |
          if node scripts/validate-skills.mjs --include-fixtures; then
            echo "::error::Validator passed on the broken fixtures — its rules are not being enforced."
            exit 1
          fi
          echo "Validator correctly rejected the fixtures."

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Match "## [VERSION]" exactly (string compare avoids regex dot ambiguity)
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::No CHANGELOG section found for v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.changelog.outputs.version }}" \
            --title "v${{ steps.changelog.outputs.version }}" \
            --notes-file /tmp/release-body.md \
            --latest

  # Anthropic's plugin directory and both marketplaces follow the plugin-bundle branch, not master. Master's root is
  # the plugin folder for every other host, and with evals/, docs/ and tests/ it is over the
  # directory's 512-file limit, which holds each version for a reviewer. The bundle carries only
  # what Claude Code loads plus README/LICENSE (scripts/build-directory-bundle.mjs). Each tag
  # adds one commit on top of the branch, so the directory sees a new version per release.
  directory-bundle:
    name: Publish plugin-bundle branch
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # git push to plugin-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes with git, so it keeps the token; no step here runs repo code after
          # the build, which reads only tracked files.
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Build bundle
        run: node scripts/build-directory-bundle.mjs "$RUNNER_TEMP/bundle" --ref "$GITHUB_REF_NAME"

      - name: Commit bundle to plugin-bundle
        run: |
          set -euo pipefail
          git config user.name "godot-prompter-bot"
          git config user.email "noreply@github.com"
          if git ls-remote --exit-code --heads origin plugin-bundle >/dev/null; then
            git fetch --no-tags origin plugin-bundle
            git switch -C plugin-bundle FETCH_HEAD
          else
            git switch --orphan plugin-bundle
          fi
          git rm -rq --ignore-unmatch .
          git clean -fdxq
          cp -a "$RUNNER_TEMP/bundle/." .
          git add -A
          if git diff --cached --quiet; then
            echo "plugin-bundle already matches $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -q -m "GodotPrompter $GITHUB_REF_NAME plugin bundle" -m "Built from $GITHUB_SHA by scripts/build-directory-bundle.mjs."
          git push origin plugin-bundle

  # Both marketplaces install from the plugin-bundle branch, the same tree Anthropic's directory
  # follows: release-only content, no evals/docs/tests. Wait for that branch to carry this tag.
  marketplace-prs:
    name: Open marketplace bump PRs
    needs: [release, directory-bundle]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check for marketplace token
        id: token-check
        env:
          MTOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$MTOKEN" ]; then
            echo "::warning::MARKETPLACE_TOKEN secret not set — skipping marketplace PRs. Bump skillsmith and godot-prompter-marketplace (marketplace.json and README counts) manually per CONTRIBUTING.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.token-check.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      # Check out godot-prompter at the release tag so the bump scripts can copy
      # the canonical marketplace entry description (incl. the current skill count)
      # into the marketplace repos — not just the version — and count skills/agents for their READMEs.
      - name: Checkout godot-prompter (canonical marketplace entry)
        if: steps.token-check.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open PR against skillsmith
        if: steps.token-check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          BRANCH="bump/godot-prompter-$V"
          # Configure git to use gh's credential helper so `git push` finds the token.
          # Without this, `gh repo clone` works (gh reads GH_TOKEN directly) but
          # `git push` falls back to interactive auth and fails in CI.
          gh auth setup-git
          gh repo clone jame581/skillsmith /tmp/skillsmith
          cd /tmp/skillsmith
          git config user.name "godot-prompter-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          node -e "
            const fs=require('fs');
            const desc=JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+'/.claude-plugin/marketplace.json','utf8')).plugins[0].description;
            const p='.claude-plugin/marketplace.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            const i=j.plugins.findIndex(x=>x.name==='godot-prompter');
            if(i<0){console.error('godot-prompter plugin not found in skillsmith marketplace');process.exit(1);}
            j.plugins[i].version='$V';
            j.plugins[i].description=desc;
            j.plugins[i].source={source:'url',url:'https://github.com/jame581/GodotPrompter.git',ref:'plugin-bundle'};
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
          node "$GITHUB_WORKSPACE/scripts/sync-marketplace-readme.mjs" README.md
          git add .claude-plugin/marketplace.json README.md
          git commit -m "chore: bump godot-prompter to $V"
          git push -u origin "$BRANCH"
          gh pr create --title "Bump godot-prompter to $V" --body "Automated bump from godot-prompter v$V release."

      - name: Open PR against godot-prompter-marketplace
        if: steps.token-check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          BRANCH="bump/godot-prompter-$V"
          # Configure git to use gh's credential helper so `git push` finds the token.
          gh auth setup-git
          gh repo clone jame581/godot-prompter-marketplace /tmp/legacy
          cd /tmp/legacy
          git config user.name "godot-prompter-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          node -e "
            const fs=require('fs');
            const desc=JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+'/.claude-plugin/marketplace.json','utf8')).plugins[0].description;
            const p='.claude-plugin/marketplace.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            const i=j.plugins.findIndex(x=>x.name==='godot-prompter');
            if(i<0){console.error('godot-prompter plugin not found in legacy marketplace');process.exit(1);}
            j.plugins[i].version='$V';
            j.plugins[i].description=desc;
            j.plugins[i].source={source:'url',url:'https://github.com/jame581/GodotPrompter.git',ref:'plugin-bundle'};
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
          node "$GITHUB_WORKSPACE/scripts/sync-marketplace-readme.mjs" README.md
          git add .claude-plugin/marketplace.json README.md
          git commit -m "chore: bump godot-prompter to $V"
          git push -u origin "$BRANCH"
          gh pr create --title "Bump godot-prompter to $V" --body "Automated bump from godot-prompter v$V release. Legacy marketplace — for existing installs only."
